[package]
name = "onedrive-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
adw = { package = "libadwaita", version = "0.9.2" }
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_10"] }
onedrive-core = { path = "../core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zbus = { version = "5.19", features = ["blocking"] }

[dev-dependencies]
tempfile = "3.27"
