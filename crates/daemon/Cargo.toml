[package]
name = "onedrive-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
keyring = "4.2"
onedrive-core = { path = "../core" }
oauth2 = "5.0"
sha2 = "0.10"
tokio = { version = "1.53", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
url = "2.5"
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
