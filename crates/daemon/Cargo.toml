[package]
name = "onedrive-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
keyring = "4.2"
onedrive-catalog = { path = "../catalog" }
onedrive-core = { path = "../core" }
oauth2 = "5.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.27"
tokio = { version = "1.53", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
url = "2.5"
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
