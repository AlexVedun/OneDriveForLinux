name: Rust checks
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev pkg-config dbus-bin libglib2.0-bin desktop-file-utils appstream
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build -p onedrive-daemon
      - run: SMOKE_TEST_LOGIN=1 dbus-run-session -- sh scripts/smoke-dbus.sh
      - run: SMOKE_TEST_LOGIN=xdg dbus-run-session -- sh scripts/smoke-dbus.sh
      - run: sh -n scripts/bundle-appdir-libs.sh scripts/smoke-bundle-appdir.sh
      - run: sh scripts/smoke-appdir.sh

  appimage:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libgtk-4-bin libadwaita-1-dev adwaita-icon-theme pkg-config dbus-bin libglib2.0-bin desktop-file-utils appstream
      - name: Fetch verified AppImage tools
        run: |
          sh scripts/fetch-appimage-tools.sh "$RUNNER_TEMP/onedrive-tools"
          echo "LINUXDEPLOY=$RUNNER_TEMP/onedrive-tools/linuxdeploy-x86_64.AppImage" >> "$GITHUB_ENV"
          echo "APPIMAGETOOL=$RUNNER_TEMP/onedrive-tools/appimagetool-x86_64.AppImage" >> "$GITHUB_ENV"
          echo "APPIMAGETOOL_RUNTIME_FILE=$RUNNER_TEMP/onedrive-tools/runtime-x86_64" >> "$GITHUB_ENV"
      - name: Smoke test AppImage
        run: sh scripts/smoke-appimage.sh
      - name: Read application version
        id: version
        run: |
          version=$(sh scripts/app-version.sh)
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
      - name: Build release AppImage
        run: sh scripts/build-appimage.sh
      - name: Verify release startup and write checksum
        run: |
          image="OneDriveForLinux-${APP_VERSION}-x86_64.AppImage"
          dbus-run-session -- sh scripts/smoke-appimage-runtime.sh "target/dist/$image"
          cd target/dist
          sha256sum "$image" > "$image.sha256"
          sha256sum -c "$image.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: OneDriveForLinux-${{ steps.version.outputs.value }}-x86_64
          path: |
            target/dist/OneDriveForLinux-${{ steps.version.outputs.value }}-x86_64.AppImage
            target/dist/OneDriveForLinux-${{ steps.version.outputs.value }}-x86_64.AppImage.sha256
          if-no-files-found: error
