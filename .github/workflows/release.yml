name: Release AppImage

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing X.Y.Z tag to move to the selected branch after a successful build'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Validate release tag and Cargo version
        run: |
          sh scripts/check-release-tag.sh "$RELEASE_TAG"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            test "$GITHUB_REF_TYPE" = branch || { echo 'Select a branch containing the release fix.' >&2; exit 1; }
            git ls-remote --exit-code --refs origin "refs/tags/$RELEASE_TAG" >/dev/null || { echo "Tag $RELEASE_TAG does not exist." >&2; exit 1; }
          fi
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libgtk-4-bin libadwaita-1-dev adwaita-icon-theme librsvg2-common libgdk-pixbuf2.0-bin pkg-config dbus-bin libglib2.0-bin desktop-file-utils appstream
      - name: Check source and release tag validation
        run: |
          sh scripts/test-release-tag.sh
          sh scripts/test-retarget-release-tag.sh
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          cargo build -p onedrive-daemon
          SMOKE_TEST_LOGIN=1 dbus-run-session -- sh scripts/smoke-dbus.sh
          SMOKE_TEST_LOGIN=xdg dbus-run-session -- sh scripts/smoke-dbus.sh
          sh scripts/smoke-appdir.sh
      - name: Fetch verified AppImage tools
        run: |
          sh scripts/fetch-appimage-tools.sh "$RUNNER_TEMP/onedrive-tools"
          echo "LINUXDEPLOY=$RUNNER_TEMP/onedrive-tools/linuxdeploy-x86_64.AppImage" >> "$GITHUB_ENV"
          echo "APPIMAGETOOL=$RUNNER_TEMP/onedrive-tools/appimagetool-x86_64.AppImage" >> "$GITHUB_ENV"
          echo "APPIMAGETOOL_RUNTIME_FILE=$RUNNER_TEMP/onedrive-tools/runtime-x86_64" >> "$GITHUB_ENV"
      - name: Smoke test AppImage builder
        run: sh scripts/smoke-appimage.sh
      - name: Build and verify release AppImage
        run: |
          image="OneDriveForLinux-${RELEASE_TAG}-x86_64.AppImage"
          sh scripts/build-appimage.sh
          dbus-run-session -- sh scripts/smoke-appimage-runtime.sh "target/dist/$image"
          cd target/dist
          sha256sum "$image" > "$image.sha256"
          sha256sum -c "$image.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: OneDriveForLinux-${{ env.RELEASE_TAG }}-x86_64
          path: |
            target/dist/OneDriveForLinux-${{ env.RELEASE_TAG }}-x86_64.AppImage
            target/dist/OneDriveForLinux-${{ env.RELEASE_TAG }}-x86_64.AppImage.sha256
          if-no-files-found: error
      - name: Point failed tag at the verified build
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/retarget-release-tag.sh "$RELEASE_TAG"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="OneDriveForLinux-${RELEASE_TAG}-x86_64.AppImage"
          gh release create "$RELEASE_TAG" \
            "target/dist/$image" "target/dist/$image.sha256" \
            --verify-tag --title "OneDriveForLinux $RELEASE_TAG" --generate-notes
