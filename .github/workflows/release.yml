name: Release AppImage

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Validate release tag and Cargo version
        run: sh scripts/check-release-tag.sh "$GITHUB_REF_NAME"
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libgtk-4-bin libadwaita-1-dev adwaita-icon-theme pkg-config dbus-bin libglib2.0-bin desktop-file-utils appstream
      - name: Check source and release tag validation
        run: |
          sh scripts/test-release-tag.sh
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          cargo build -p onedrive-daemon
          SMOKE_TEST_LOGIN=1 dbus-run-session -- sh scripts/smoke-dbus.sh
          SMOKE_TEST_LOGIN=xdg dbus-run-session -- sh scripts/smoke-dbus.sh
          sh scripts/smoke-appdir.sh
      - name: Fetch verified AppImage tools
        run: |
          sh scripts/fetch-appimage-tools.sh "$RUNNER_TEMP/onedrive-tools"
          echo "LINUXDEPLOY=$RUNNER_TEMP/onedrive-tools/linuxdeploy-x86_64.AppImage" >> "$GITHUB_ENV"
          echo "APPIMAGETOOL=$RUNNER_TEMP/onedrive-tools/appimagetool-x86_64.AppImage" >> "$GITHUB_ENV"
          echo "APPIMAGETOOL_RUNTIME_FILE=$RUNNER_TEMP/onedrive-tools/runtime-x86_64" >> "$GITHUB_ENV"
      - name: Smoke test AppImage builder
        run: sh scripts/smoke-appimage.sh
      - name: Build and verify release AppImage
        run: |
          image="OneDriveForLinux-${GITHUB_REF_NAME}-x86_64.AppImage"
          sh scripts/build-appimage.sh
          dbus-run-session -- sh scripts/smoke-appimage-runtime.sh "target/dist/$image"
          cd target/dist
          sha256sum "$image" > "$image.sha256"
          sha256sum -c "$image.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: OneDriveForLinux-${{ github.ref_name }}-x86_64
          path: |
            target/dist/OneDriveForLinux-${{ github.ref_name }}-x86_64.AppImage
            target/dist/OneDriveForLinux-${{ github.ref_name }}-x86_64.AppImage.sha256
          if-no-files-found: error
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="OneDriveForLinux-${GITHUB_REF_NAME}-x86_64.AppImage"
          gh release create "$GITHUB_REF_NAME" \
            "target/dist/$image" "target/dist/$image.sha256" \
            --verify-tag --title "OneDriveForLinux $GITHUB_REF_NAME" --generate-notes
